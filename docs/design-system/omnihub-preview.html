<div id="omnihub-design-preview" aria-label="Proposta interativa do design system Omnihub">
  <style>
    #omnihub-design-preview {
      --oh-background: light-dark(#f5f7fa, #0b1422);
      --oh-surface: light-dark(#ffffff, #142235);
      --oh-text: light-dark(#172b4d, #e6edf5);
      --oh-muted: light-dark(#526174, #a2b3c7);
      --oh-line: light-dark(#dfe6ee, #2a3b50);
      --oh-input-line: light-dark(#8293a6, #5a718c);
      --oh-action: light-dark(#0f766e, #2dd4bf);
      --oh-action-hover: light-dark(#115e59, #5eead4);
      --oh-on-action: light-dark(#ffffff, #082f2c);
      --oh-selected: light-dark(#e7f5f2, #173b3d);
      --oh-success: light-dark(#166534, #86efac);
      --oh-success-bg: light-dark(#f0fdf4, #132d23);
      --oh-warning: light-dark(#92400e, #fcd34d);
      --oh-warning-bg: light-dark(#fffbeb, #33270e);
      --oh-error: light-dark(#b42318, #fda29b);
      --oh-error-bg: light-dark(#fef3f2, #3f1718);
      --oh-radius: 10px;
      container: omni / inline-size;
      margin: 0 auto;
      color: var(--oh-text);
      background: var(--oh-background);
      font: 14px/1.5 Inter, system-ui, sans-serif;
      border: 1px solid var(--oh-line);
      border-radius: 14px;
    }
    #omnihub-design-preview *, #omnihub-design-preview *::before, #omnihub-design-preview *::after { box-sizing: border-box; }
    #omnihub-design-preview [hidden] { display: none !important; }
    #omnihub-design-preview h1, #omnihub-design-preview h2, #omnihub-design-preview h3, #omnihub-design-preview p { margin: 0; }
    #omnihub-design-preview h1 { font-size: 25px; line-height: 1.25; font-weight: 600; letter-spacing: -.5px; }
    #omnihub-design-preview h2 { font-size: 17px; font-weight: 600; }
    #omnihub-design-preview h3 { font-size: 14px; font-weight: 500; }
    #omnihub-design-preview button, #omnihub-design-preview input, #omnihub-design-preview select { font: inherit; }
    #omnihub-design-preview button { transition: background-color 140ms ease; }
    #omnihub-design-preview button:focus-visible, #omnihub-design-preview select:focus-visible, #omnihub-design-preview input:focus-visible { outline: 3px solid var(--oh-action); outline-offset: 3px; }
    #omnihub-design-preview .oh-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 24px; padding-right: 104px; background: var(--oh-surface); border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--oh-line); flex-wrap: wrap; }
    #omnihub-design-preview .oh-brand { display: flex; align-items: center; gap: 10px; }
    #omnihub-design-preview .oh-logo { width: 42px; height: 42px; background: #fff; border-radius: 8px; object-fit: contain; }
    #omnihub-design-preview .oh-wordmark { font-size: 20px; letter-spacing: -.5px; font-weight: 600; }
    #omnihub-design-preview .oh-caption { color: var(--oh-muted); font-size: 12px; }
    #omnihub-design-preview .oh-theme { display: flex; gap: 8px; align-items: center; color: var(--oh-muted); font-size: 12px; }
    #omnihub-design-preview select { font-size: 16px; padding: 7px; border: 1px solid var(--oh-input-line); border-radius: 6px; background: var(--oh-surface); color: var(--oh-text); max-width: 100%; }
    #omnihub-design-preview .oh-layout { display: grid; grid-template-columns: 158px minmax(0, 1fr); }
    #omnihub-design-preview .oh-sidebar { padding: 24px 12px; border-right: 1px solid var(--oh-line); background: var(--oh-surface); border-radius: 0 0 0 14px; }
    #omnihub-design-preview nav { display: grid; gap: 6px; }
    #omnihub-design-preview .oh-nav { display: flex; gap: 9px; align-items: center; background: transparent; border: 0; color: var(--oh-muted); padding: 11px 12px; border-radius: 7px; text-align: left; min-height: 42px; }
    #omnihub-design-preview .oh-nav[aria-current="page"] { background: var(--oh-selected); color: var(--oh-action); font-weight: 500; }
    #omnihub-design-preview .oh-nav:hover { background: var(--oh-selected); }
    #omnihub-design-preview .oh-nav svg { width: 16px; height: 16px; flex-shrink: 0; }
    #omnihub-design-preview .oh-main { padding: 26px 24px; min-width: 0; }
    #omnihub-design-preview .oh-title { display: grid; gap: 6px; margin-bottom: 24px; }
    #omnihub-design-preview .oh-intro { color: var(--oh-muted); }
    #omnihub-design-preview .oh-surface { background: var(--oh-surface); border: 1px solid var(--oh-line); border-radius: var(--oh-radius); }
    #omnihub-design-preview .oh-section-header { padding: 16px; border-bottom: 1px solid var(--oh-line); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    #omnihub-design-preview .oh-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
    #omnihub-design-preview .oh-tag svg { width: 13px; height: 13px; }
    #omnihub-design-preview .oh-ok { color: var(--oh-success); background: var(--oh-success-bg); }
    #omnihub-design-preview .oh-warning { color: var(--oh-warning); background: var(--oh-warning-bg); }
    #omnihub-design-preview .oh-error { color: var(--oh-error); background: var(--oh-error-bg); }
    #omnihub-design-preview .oh-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 13px; border-radius: 7px; border: 1px solid var(--oh-input-line); color: var(--oh-text); background: var(--oh-surface); font-weight: 500; }
    #omnihub-design-preview .oh-button:hover:not(:disabled) { background: var(--oh-selected); }
    #omnihub-design-preview .oh-primary { background: var(--oh-action); color: var(--oh-on-action); border-color: var(--oh-action); }
    #omnihub-design-preview .oh-primary:hover:not(:disabled) { background: var(--oh-action-hover); }
    #omnihub-design-preview .oh-button:disabled { opacity: .5; cursor: not-allowed; }
    #omnihub-design-preview .oh-link { background: transparent; border: 0; color: var(--oh-action); min-height: 36px; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
    #omnihub-design-preview table { border-collapse: collapse; width: 100%; font-size: 14px; }
    #omnihub-design-preview th { color: var(--oh-muted); font-weight: 500; font-size: 12px; text-align: left; padding: 12px 10px; }
    #omnihub-design-preview td { padding: 15px 10px; border-top: 1px solid var(--oh-line); vertical-align: top; }
    #omnihub-design-preview th:first-child, #omnihub-design-preview td:first-child { padding-left: 16px; }
    #omnihub-design-preview .oh-number { text-align: right; font-variant-numeric: tabular-nums; }
    #omnihub-design-preview .oh-product { display: grid; gap: 5px; }
    #omnihub-design-preview .oh-product code { font: 12px ui-monospace, monospace; color: var(--oh-muted); overflow-wrap: anywhere; }
    #omnihub-design-preview .oh-available { font-weight: 600; }
    #omnihub-design-preview .oh-detail { padding: 18px; margin-top: 16px; background: var(--oh-surface); border-left: 3px solid var(--oh-action); border-radius: 0 8px 8px 0; }
    #omnihub-design-preview .oh-detail h2 { margin-bottom: 8px; }
    #omnihub-design-preview .oh-detail p + p { margin-top: 6px; }
    #omnihub-design-preview .oh-swatch-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
    #omnihub-design-preview .oh-swatch { padding: 14px; display: flex; gap: 12px; align-items: center; }
    #omnihub-design-preview .oh-swatch-mark { width: 35px; height: 35px; flex-shrink: 0; border-radius: 8px; }
    #omnihub-design-preview .oh-swatch-meta { display: grid; min-width: 0; gap: 3px; }
    #omnihub-design-preview .oh-controls-demo { padding: 18px; display: grid; gap: 18px; }
    #omnihub-design-preview .oh-control-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #omnihub-design-preview .oh-field { display: grid; gap: 7px; max-width: 330px; }
    #omnihub-design-preview .oh-field input { min-width: 0; width: 100%; font-size: 16px; padding: 10px 12px; color: var(--oh-text); border: 1px solid var(--oh-input-line); border-radius: 7px; background: var(--oh-surface); }
    #omnihub-design-preview .oh-field [aria-invalid="true"] { border-color: var(--oh-error); }
    #omnihub-design-preview .oh-field-error { color: var(--oh-error); font-size: 12px; }
    #omnihub-design-preview .oh-step-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    #omnihub-design-preview .oh-step-controls button { flex: 1; }
    #omnihub-design-preview .oh-step-controls button[aria-pressed="true"] { border-color: var(--oh-action); color: var(--oh-action); background: var(--oh-selected); }
    #omnihub-design-preview .oh-pipeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #omnihub-design-preview .oh-stage { padding: 16px; min-width: 0; }
    #omnihub-design-preview .oh-stage h2 { font-size: 15px; margin-bottom: 5px; }
    #omnihub-design-preview .oh-stage pre { color: var(--oh-text); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.8 ui-monospace, monospace; margin: 15px 0 0; }
    #omnihub-design-preview .oh-stage.oh-active { border-color: var(--oh-action); }
    #omnihub-design-preview .oh-footer { color: var(--oh-muted); font-size: 12px; margin-top: 18px; }
    #omnihub-design-preview #oh-feedback { margin-top: 12px; color: var(--oh-success); }
    #omnihub-design-preview.oh-compact td { padding-top: 10px; padding-bottom: 10px; }
    @container omni (max-width: 900px) {
      #omnihub-design-preview .oh-pipeline { grid-template-columns: minmax(0, 1fr); }
      #omnihub-design-preview .oh-stage:not(.oh-active) { display: none; }
    }
    @container omni (max-width: 680px) {
      #omnihub-design-preview .oh-header { padding: 14px 16px; padding-right: 96px; gap: 12px; }
      #omnihub-design-preview .oh-theme { flex-wrap: wrap; }
      #omnihub-design-preview .oh-layout { grid-template-columns: minmax(0, 1fr); }
      #omnihub-design-preview .oh-sidebar { padding: 10px; border-right: 0; border-bottom: 1px solid var(--oh-line); border-radius: 0; }
      #omnihub-design-preview nav { display: flex; flex-wrap: wrap; gap: 3px; }
      #omnihub-design-preview .oh-nav { padding: 9px; min-height: 44px; }
      #omnihub-design-preview .oh-nav svg { display: none; }
      #omnihub-design-preview .oh-main { padding: 22px 16px; }
      #omnihub-design-preview h1 { font-size: 23px; }
      #omnihub-design-preview .oh-swatch-grid { grid-template-columns: minmax(0, 1fr); }
      #omnihub-design-preview table, #omnihub-design-preview tbody { display: block; }
      #omnihub-design-preview thead { display: none; }
      #omnihub-design-preview tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 16px; gap: 12px; border-bottom: 1px solid var(--oh-line); }
      #omnihub-design-preview tbody tr:last-child { border-bottom: 0; }
      #omnihub-design-preview tbody td, #omnihub-design-preview tbody td:first-child { display: block; border: 0; padding: 0; text-align: left; }
      #omnihub-design-preview tbody td.oh-number { text-align: left; }
      #omnihub-design-preview tbody td:first-child { grid-column: 1 / -1; }
      #omnihub-design-preview td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; color: var(--oh-muted); margin-bottom: 3px; }
      #omnihub-design-preview .oh-link { min-height: 44px; }
      #omnihub-design-preview .oh-button, #omnihub-design-preview select { min-height: 44px; }
      #omnihub-design-preview.oh-compact td { padding: 0; }
    }
    @media (prefers-reduced-motion: reduce) { #omnihub-design-preview button { transition: none; } }
  </style>

      <div><div class="oh-wordmark">Omnihub</div><div class="oh-caption">Proposta de design · v0.1</div></div>
    </div>
    <label class="oh-theme" for="oh-theme">Aparência
      <select id="oh-theme"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select>
    </label>
  </header>
  <div class="oh-layout">
    <aside class="oh-sidebar"><nav aria-label="Explorar a proposta">
      <button type="button" class="oh-nav cursor-interaction" data-page="foundations"><i data-lucide="swatch-book" aria-hidden="true"></i>Fundamentos</button>
      <button type="button" class="oh-nav cursor-interaction" data-page="inventory" aria-current="page"><i data-lucide="boxes" aria-hidden="true"></i>Estoque</button>
      <button type="button" class="oh-nav cursor-interaction" data-page="pipeline"><i data-lucide="workflow" aria-hidden="true"></i>Pipeline</button>
    </nav></aside>
    <main class="oh-main">
      <div id="oh-content"></div>
      <div id="oh-feedback" role="status" aria-live="polite"></div>
      <div class="oh-footer">Dados ilustrativos · Proposta visual, sem operações no estoque real.</div>
    </main>
  </div>
  <script>
  (() => {
    const root = document.getElementById('omnihub-design-preview');
    const content = root.querySelector('#oh-content');
    const themeSelect = root.querySelector('#oh-theme');
    const feedback = root.querySelector('#oh-feedback');
    const state = { page: 'inventory', theme: 'system', density: 'comfortable', mobile: false, product: null, stage: 'canonical' };
    const products = [
      { sku: 'SKU-FONTE-600W', name: 'Fonte ATX 600W', physical: 20, reserved: 4, safety: 2, available: 14, reason: 'Disponível', tone: 'ok' },
      { sku: 'SKU-SSD-NVME-1TB', name: 'SSD NVMe 1 TB', physical: 8, reserved: 6, safety: 2, available: 0, reason: 'Sem disponível', tone: 'warning' },
      { sku: 'SKU-MEM-DDR5-16GB', name: 'Memória DDR5 16 GB', physical: 12, reserved: 2, safety: 2, available: 8, reason: 'Disponível', tone: 'ok' }
    ];
    const esc = text => String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    const title = (name, subtitle) => `<div class="oh-title"><h1>${name}</h1><p class="oh-intro">${subtitle}</p></div>`;
    function applySaved(saved) {
      const data = saved?.modelContent || {};
      if (['inventory', 'foundations', 'pipeline'].includes(data.page)) state.page = data.page;
      if (['system', 'light', 'dark'].includes(data.theme)) state.theme = data.theme;
      if (['comfortable', 'compact'].includes(data.density)) state.density = data.density;
      if (typeof data.mobile === 'boolean') state.mobile = data.mobile;
      const privateData = saved?.privateContent || {};
      if (['raw', 'canonical', 'erp'].includes(privateData.stage)) state.stage = privateData.stage;
    }
    function persist() {
      if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { page: state.page, theme: state.theme, density: state.density, mobile: state.mobile }, privateContent: { stage: state.stage } }).catch(() => {});
    }
    function inventory() {
      const rows = products.map(p => `<tr><td><div class="oh-product"><span>${p.name}</span><code>${p.sku}</code><span><span class="oh-tag oh-${p.tone}">${p.reason}</span></span></div></td><td class="oh-number" data-label="Físico">${p.physical}</td><td class="oh-number" data-label="Reservado">${p.reserved}</td><td class="oh-number" data-label="Segurança">${p.safety}</td><td class="oh-number oh-available" data-label="Disponível">${p.available}</td><td><button type="button" class="oh-link cursor-interaction" data-product="${p.sku}" aria-expanded="${state.product === p.sku}" aria-controls="oh-product-detail">Detalhes</button></td></tr>`).join('');
      const selected = products.find(p => p.sku === state.product);
      return title('Estoque canônico', 'O saldo de todos os canais, em um só lugar.') +
        `<section class="oh-surface" aria-label="Produtos ilustrativos"><div class="oh-section-header"><h2>Produtos</h2><span class="oh-caption">3 produtos · Atualização ilustrativa</span></div><table aria-label="Saldos de estoque"><thead><tr><th>Produto</th><th class="oh-number">Físico</th><th class="oh-number">Reservado</th><th class="oh-number">Segurança</th><th class="oh-number">Disponível</th><th><span class="oh-caption">Ações</span></th></tr></thead><tbody>${rows}</tbody></table></section>` +
        `<section id="oh-product-detail" class="oh-detail" aria-label="Detalhe do produto" ${selected ? '' : 'hidden'}>${selected ? `<h2>${selected.name}</h2><p>Físico ${selected.physical} · Reservado ${selected.reserved} · Segurança ${selected.safety}</p><p><strong>Disponível: ${selected.available} unidades</strong></p><p class="oh-caption">${selected.available === 0 ? 'Há unidades físicas, mas elas estão reservadas ou protegidas pela margem de segurança.' : 'O detalhe mantém os saldos e a ação próximos do produto selecionado.'}</p>` : ''}</section>`;
    }
    function foundations() {
      const swatches = [ ['Azul da marca', '#11365F', '#11365F'], ['Turquesa da marca', '#19C1B9', '#19C1B9'], ['Ação primária', 'Claro #0F766E · Escuro #2DD4BF', 'var(--oh-action)'], ['Conteúdo', 'Texto e superfícies por tema', 'var(--oh-text)'] ];
      return title('Uma identidade, dois temas', 'Clareza, consistência e resposta a cada interação.') +
        `<div class="oh-swatch-grid">${swatches.map(([label, value, color]) => `<div class="oh-swatch oh-surface"><span class="oh-swatch-mark" style="background:${color}"></span><div class="oh-swatch-meta"><span>${label}</span><span class="oh-caption">${value}</span></div></div>`).join('')}</div>` +
        `<section class="oh-surface oh-controls-demo" aria-label="Estados dos componentes"><h2>Controles e feedback</h2><div class="oh-control-row"><button type="button" class="oh-button oh-primary cursor-interaction" data-demo-action>Confirmar seleção</button><button type="button" class="oh-button cursor-interaction" data-demo-secondary>Limpar seleção</button><button type="button" class="oh-button" disabled>Indisponível</button></div><div class="oh-control-row"><span class="oh-tag oh-ok"><i data-lucide="check" aria-hidden="true"></i>Concluído</span><span class="oh-tag oh-warning"><i data-lucide="triangle-alert" aria-hidden="true"></i>Atenção</span><span class="oh-tag oh-error"><i data-lucide="circle-x" aria-hidden="true"></i>Falha na integração</span></div><label class="oh-field" for="oh-sku"><span>SKU canônico</span><input id="oh-sku" value="SKU-FONTE-600W" aria-describedby="oh-sku-help oh-sku-error" aria-invalid="false"><span id="oh-sku-help" class="oh-caption">O rótulo permanece visível durante a edição.</span><span id="oh-sku-error" class="oh-field-error" role="alert" hidden>Informe o SKU canônico.</span></label></section>`;
    }
    function pipeline() {
      const stages = [
        { id: 'raw', name: 'Origem', sub: 'Payload recebido', value: { preco: 349.9, cep: '59.600-000', item: 'sandbox-001' } },
        { id: 'canonical', name: 'Canônico', sub: 'Informação normalizada', value: { sku: 'SKU-FONTE-600W', unitPriceCents: 34990, postalCode: '59600000' } },
        { id: 'erp', name: 'ERP', sub: 'Payload de destino', value: { codigo_sku: 'SKU-FONTE-600W', valor_total: 349.9, quantidade: 1 } }
      ];
      return title('Fluxo de pedidos', 'Diferentes formatos. Uma informação consistente.') +
        `<div class="oh-step-controls" role="group" aria-label="Selecionar etapa do pedido">${stages.map(s => `<button type="button" class="oh-button cursor-interaction" data-stage="${s.id}" aria-pressed="${state.stage === s.id}">${s.name}</button>`).join('')}</div>` +
        `<div class="oh-pipeline">${stages.map(s => `<section class="oh-surface oh-stage ${state.stage === s.id ? 'oh-active' : ''}" aria-label="Etapa ${s.name}"><h2>${s.name}</h2><p class="oh-caption">${s.sub}</p><pre><code>${esc(JSON.stringify(s.value, null, 2))}</code></pre></section>`).join('')}</div>`;
    }
    function render() {
      const activeProduct = document.activeElement?.getAttribute('data-product');
      const activeStage = document.activeElement?.getAttribute('data-stage');
      if (state.theme === 'system') root.style.removeProperty('color-scheme'); else root.style.colorScheme = state.theme;
      root.style.maxWidth = state.mobile ? '390px' : 'none';
      root.classList.toggle('oh-compact', state.density === 'compact');
      themeSelect.value = state.theme;
      root.querySelectorAll('[data-page]').forEach(button => {
        if (button.dataset.page === state.page) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
      });
      content.innerHTML = state.page === 'foundations' ? foundations() : state.page === 'pipeline' ? pipeline() : inventory();
      if (activeProduct) content.querySelector(`[data-product="${activeProduct}"]`)?.focus();
      if (activeStage) content.querySelector(`[data-stage="${activeStage}"]`)?.focus();
      if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    root.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      if (button.dataset.page) { state.page = button.dataset.page; feedback.textContent = ''; render(); persist(); }
      else if (button.dataset.product) { state.product = state.product === button.dataset.product ? null : button.dataset.product; render(); }
      else if (button.dataset.stage) { state.stage = button.dataset.stage; render(); persist(); }
      else if (button.hasAttribute('data-demo-action')) feedback.textContent = 'Seleção confirmada nesta prévia.';
      else if (button.hasAttribute('data-demo-secondary')) feedback.textContent = 'Seleção limpa nesta prévia.';
    });
    root.addEventListener('input', event => {
      if (event.target.id !== 'oh-sku') return;
      const invalid = !event.target.value.trim();
      event.target.setAttribute('aria-invalid', String(invalid));
      root.querySelector('#oh-sku-error').hidden = !invalid;
    });
    themeSelect.addEventListener('change', () => { state.theme = themeSelect.value; render(); persist(); });
    window.addEventListener('openai:set_globals', event => {
      if (event.detail?.globals?.widgetState) { applySaved(event.detail.globals.widgetState); render(); }
    });
    applySaved(window.openai?.widgetState);
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: () => { render(); persist(); } });
      tweak.addToggle(state, 'mobile', { label: 'Prévia de celular' });
      tweak.addSelect(state, 'density', { label: 'Densidade', options: [{ label: 'Confortável', value: 'comfortable' }, { label: 'Compacta', value: 'compact' }] });
    }
  })();
  </script>
</div>
